<div id="app">
<style>
  #app { font-family: Arial, Helvetica, sans-serif; color: #101820; max-width: 900px; margin: 0 auto; }
  .rm-red { color: #E00700; }
  .setup { border: 0px solid #D0D0C3; border-radius: 6px; padding: 20px 24px; margin-bottom: 24px; background: transparent; }
  .setup h2 { font-size: 24px; margin: 0 0 18px 0; color: #003057; }
  .setup p.sub { font-size: 15px; color: #6C6463; margin: 0 0 9px 0; padding: 0 0 9px 0; border-bottom:1px solid #f1f2f3;}
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 36px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 14px; font-weight: bold; color: #003057; }
  .field input[type=number] { width: 90px; padding: 6px 8px; border: 1px solid #999; border-radius: 4px; font-size: 14px; }
  .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 8px; }
  .items-grid input[type=text] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; }
  .items-note { font-size: 12px; color: #6C6463; margin-bottom: 16px; }
  .btns { display: flex; gap: 12px; align-items: center; }
  button { cursor: pointer; border: none; border-radius: 4px; padding: 10px 18px; font-size: 14px; font-weight: bold; }
  #generateBtn { background: #E00700; color: #fff; }
  #generateBtn:hover { background: #b80600; }
  #printBtn { background: #003057; color: #fff; }
  #printBtn:hover { background: #002240; }
  #status { font-size: 13px; color: #6C6463; }
  #cardsWrap { display: none; }

  .page { display: flex; flex-direction: column; gap: 0; page-break-after: always; }
  .card { box-sizing: border-box; padding: 14px 16px 16px 16px; position: relative; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-header .titles h1 { font-size: 20px; margin: 0; color: #003057; letter-spacing: 0.5px; }
  .card-header .titles p { font-size: 10px; margin: 2px 0 0 0; color: #6C6463; }
  .card-header img { height: 22px; }
  .accent { height: 3px; background: #E00700; margin-bottom: 10px; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; }
  .cell { border: 1px solid #999; background: #fff; font-size: 9.2px; line-height: 1.15; text-align: center; display: flex; align-items: center; justify-content: center; padding: 4px; min-height: 62px; color: #101820; }
  .cell.free { background: #fff; color: #E00700; font-weight: bold; font-size: 12px; border: 2px solid #E00700; }
  .cutline { border-top: 1px dashed #999; text-align: center; font-size: 9px; color: #999; margin: 4px 0; position: relative; }
  .cutline span { background: #fff; padding: 0 8px; position: relative; top: -7px; }

  @media print {
    .setup, #printBtn, #status, .no-print { display: none !important; }
    #cardsWrap { display: block !important; }
    #app { max-width: none; }
    @page { size: letter portrait; margin: 0.3in; }
    .page { height: 100%; justify-content: space-between; }
    .card { height: 47%; overflow: hidden; }
  }
</style>

<div class="setup no-print">
  <div class="row">
    <div class="field">
      <label>Number of cards to print</label>
      <input type="number" id="cardCount" min="1" max="200" value="10" />
    </div>
    <div class="btns">
      <button id="generateBtn">Generate Cards</button>
      <button id="printBtn" style="display:none;">Print / Save as PDF</button>
      <span id="status"></span>
    </div>
  </div>
  <div class="row">
  <div class="field" style="margin-bottom:8px;">
    <label>Custom bingo items (optional)</label>
      <p class="items-note">Add as many site-specific items as you like, up to 24. Remaining squares will be filled with general site-visit items.</p>

  </div>
  <div class="items-grid" id="itemsGrid"></div>
  <button id="addItemBtn" type="button" style="background:#D0D0C3; color:#003057;">+ Add custom item</button>
</div>

<div id="cardsWrap"></div>

</div>
</div>

    wrapper.style.gap = '4px';
    wrapper.style.alignItems = 'center';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Custom item ' + (itemsGrid.children.length + 1);
    inp.style.flex = '1';

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '×';
    removeBtn.title = 'Remove item';
    removeBtn.style.background = '#6C6463';
    removeBtn.style.color = '#fff';
    removeBtn.style.padding = '4px 10px';
    removeBtn.style.fontSize = '12px';
    removeBtn.addEventListener('click', function() {
      wrapper.remove();
      updateAddBtnState();
    });

    wrapper.appendChild(inp);
    wrapper.appendChild(removeBtn);
    itemsGrid.appendChild(wrapper);
    updateAddBtnState();
    inp.focus();
  }

  addItemBtn.addEventListener('click', addItemField);
  addItemField(); // start with one field visible
  updateAddBtnState();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildPool() {
    const inputs = Array.from(itemsGrid.querySelectorAll('input'));
    let custom = inputs.map(i => i.value.trim()).filter(v => v.length > 0);
    // dedupe custom, preserve order
    const seen = new Set();
    custom = custom.filter(v => {
      const key = v.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 24);

    const remaining = 24 - custom.length;
    const availableDefaults = DEFAULTS.filter(d => !seen.has(d.toLowerCase()));
    const chosenDefaults = shuffle(availableDefaults).slice(0, remaining);

    let pool = custom.concat(chosenDefaults);
    // safety net: if still short (shouldn't happen with 24 defaults), pad by reusing defaults
    if (pool.length < 24) {
      const filler = shuffle(DEFAULTS.filter(d => !pool.includes(d)));
      pool = pool.concat(filler).slice(0, 24);
    }
    return pool;
  }

  function renderCard(pool) {
    const order = shuffle(pool);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <div class="titles">
          <h1 style="color:#101820;">Site Visit Bingo</h1>
          <p>Mark a square when you see or do it. Five in a row wins!</p>
        </div>
        <img src="${LOGO}" alt="Robins &amp; Morton" />
      </div>
      <div class="accent"></div>
    `;
    const grid = document.createElement('div');
    grid.className = 'grid5';
    let idx = 0;
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const cell = document.createElement('div');
        if (r === 2 && c === 2) {
          cell.className = 'cell free';
          cell.textContent = 'FREE';
        } else {
          cell.className = 'cell';
          cell.textContent = order[idx];
          idx++;
        }
        grid.appendChild(cell);
      }
    }
    card.appendChild(grid);
    return card;
  }

  document.getElementById('generateBtn').addEventListener('click', function() {
    const count = Math.max(1, Math.min(200, parseInt(document.getElementById('cardCount').value, 10) || 1));
    const pool = buildPool();
    if (pool.length < 24) {
      document.getElementById('status').textContent = 'Not enough unique items to fill a 24-square grid.';
      return;
    }
    const wrap = document.getElementById('cardsWrap');
    wrap.innerHTML = '';
    for (let i = 0; i < count; i += 2) {
      const page = document.createElement('div');
      page.className = 'page';
      page.appendChild(renderCard(pool));
      const cut = document.createElement('div');
      cut.className = 'cutline';
      cut.innerHTML = '<span>cut here</span>';
      page.appendChild(cut);
      if (i + 1 < count) {
        page.appendChild(renderCard(pool));
      }
      wrap.appendChild(page);
    }
    document.getElementById('printBtn').style.display = 'inline-block';
    document.getElementById('status').textContent = count + ' card(s) generated below. Scroll down to preview, then click Print / Save as PDF.';
    wrap.style.display = 'block';
    wrap.scrollIntoView({behavior:'smooth'});
  });

  document.getElementById('printBtn').addEventListener('click', function() {
    window.print();
  });
})();
</script>
